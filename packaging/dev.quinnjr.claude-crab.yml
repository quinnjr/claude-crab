# SPDX-License-Identifier: MIT
#
# Flatpak manifest for claude-crab.
#
# Build and install locally:
#   flatpak-builder --user --force-clean --install \
#     build-flatpak packaging/dev.quinnjr.claude-crab.yml
#
# The only subtle part is the state directory. Claude Code runs on the host and
# is not sandboxed, so its hooks always write events to the host's
# ~/.local/state/claude-crab/inbox. The --filesystem entry below binds that
# directory through at the same path, and CrabConfig::inbox_dir() skips the
# sandbox's own XDG_STATE_HOME so the two sides meet. Without both halves the
# crab watches an empty directory and simply never wakes up.
#
# BEFORE BUILDING: cargo dependencies must be vendored, because Flathub forbids
# network access during a build. Regenerate cargo-sources.json whenever
# Cargo.lock changes:
#
#   flatpak-cargo-generator.py Cargo.lock -o packaging/cargo-sources.json
#
# (from https://github.com/flatpak/flatpak-builder-tools/tree/master/cargo)

id: dev.quinnjr.claude-crab
# The freedesktop runtime, not org.kde.Platform: rendering is pure Rust via
# skia-rs, so nothing here needs Qt or the KDE libraries any more.
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: claude-crab

finish-args:
  # Layer-shell is Wayland-only. fallback-x11 is granted anyway so the app still
  # starts in an X11 session, where it degrades to the always-on-top frameless
  # window rather than failing to launch.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

  # Hook events, written on the host by Claude Code. Spelled out rather than
  # given as xdg-state/..., which flatpak does not accept as a location token.
  # A host with a non-default XDG_STATE_HOME needs this overridden alongside
  # $CLAUDE_CRAB_STATE_DIR.
  - --filesystem=~/.local/state/claude-crab:create

  # No access to Claude Code's settings.json is requested, and none should be.
  # Hook entries are arbitrary shell commands, so write access to that file is
  # equivalent to unsandboxed code execution on the host -- far too much to hand
  # a desktop toy. Flatpak users install the hooks host-side with
  # claude-crab-hooks from the repository; the crab itself only ever reads
  # events out of the inbox.

cleanup:
  - /include
  - /lib/pkgconfig

modules:
  # Build-time only: gen_sprites.py renders the sheets and icons. Vendored as a
  # wheel rather than an sdist so the build needs no compiler for it and no
  # network access, which Flathub forbids.
  - name: python-pillow
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --prefix=${FLATPAK_DEST} pillow-*.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/84/21/a35af28dcc61f37ed850a2d64c65c701321dfbf25085e469d5559360cbbf/pillow-12.3.0-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 78cb2c6865a35ab8ff8b75fd122f6033b92a62c82801110e48ddd6c936a45d91
    cleanup:
      - '*'

  - name: claude-crab
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/claude-crab/cargo
        # So gen_sprites.py, run by build.rs, can find the vendored Pillow.
        PYTHONPATH: /app/lib/python3.12/site-packages
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/claude-crab /app/bin/claude-crab
      - install -Dm755 tools/crab_hooks.py /app/bin/claude-crab-hooks
      - install -Dm644 packaging/dev.quinnjr.claude-crab.desktop
        /app/share/applications/dev.quinnjr.claude-crab.desktop
      - install -Dm644 packaging/dev.quinnjr.claude-crab.metainfo.xml
        /app/share/metainfo/dev.quinnjr.claude-crab.metainfo.xml
      - for s in 32 48 64 128 256; do install -Dm644
        "$(find target/release/build -type d -name icons -print -quit)/$s.png"
        "/app/share/icons/hicolor/${s}x${s}/apps/dev.quinnjr.claude-crab.png"; done
    sources:
      # For a Flathub submission this becomes a git source with a tag and
      # commit; a dir source keeps local iteration fast.
      - type: dir
        path: ..
      - cargo-sources.json
