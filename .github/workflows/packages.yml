# SPDX-License-Identifier: MIT
#
# Builds installable packages for every platform the crab runs on -- .deb,
# .rpm, a macOS .dmg (universal binary), and a Windows installer -- on every
# release tag, and attaches them to the GitHub release. The Flatpak bundle has
# its own workflow (release-bundle.yml) because it needs a privileged
# container.

name: Packages

on:
  push:
    tags:
      - 'v*'
  # Buildable on demand, so the workflow can be exercised without cutting a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pillow renders the sprite sheet at build time (see build.rs), and
      # smithay-client-toolkit links libxkbcommon through pkg-config.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pillow libxkbcommon-dev libwayland-dev

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build
        run: cargo build --release --locked

      # The deb/rpm asset lists in Cargo.toml point at target/pkg-icons, which
      # only exists after staging the icons out of the hashed OUT_DIR.
      - name: Stage icons
        run: bash packaging/stage-icons.sh

      - name: Package
        run: |
          cargo deb --no-build
          cargo generate-rpm
          mkdir -p dist
          cp target/debian/*.deb target/generate-rpm/*.rpm dist/

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      - name: Keep the artifacts when there is no release to attach them to
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-crab-linux-packages
          path: dist/*

  macos:
    runs-on: macos-latest
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          pip install pillow
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Bundle and make the dmg
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          bash packaging/macos/build-app.sh "$version"

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber

      - name: Keep the artifact when there is no release to attach it to
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-crab-macos-dmg
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install pillow

      - name: Build
        run: cargo build --release --locked

      # Inno Setup 6 is preinstalled on the Windows runners. PowerShell rather
      # than bash: Git-bash's MSYS path conversion mangles the /D and /O
      # switches into Windows paths before ISCC sees them.
      - name: Make the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" /Odist packaging\windows\claude-crab.iss

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*-setup.exe --clobber

      - name: Keep the artifact when there is no release to attach it to
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-crab-windows-installer
          path: dist/*-setup.exe
